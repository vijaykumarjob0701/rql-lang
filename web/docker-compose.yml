# Full local demo: Qdrant + seed + RQL Studio (no host Node required).
#
#   docker compose -f web/docker-compose.yml up --build
#   open http://localhost:8080
#   Connect form: http://localhost:6333  (blank API key)
#
# Qdrant + Postgres/pgvector (same Studio):
#   docker compose -f web/docker-compose.yml --profile pgvector up --build
#   # or: docker compose -f web/docker-compose.pgvector.yml up --build
#
# Host-mapped ports: Studio :8080 · Qdrant :6333 · Postgres :5432 (profile)
# Inside the compose network the Studio proxy remaps localhost → qdrant / postgres
#
# Reset data:
#   docker compose -f web/docker-compose.yml --profile pgvector down -v
#
# Qdrant-only (host Vite / npm run seed):
#   docker compose -f web/docker-compose.yml up -d qdrant
name: rql-studio

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - rql_studio_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  seed:
    build:
      context: ..
      dockerfile: web/Dockerfile
      target: seed
    environment:
      QDRANT_URL: ${QDRANT_INTERNAL_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_healthy
    restart: on-failure

  studio:
    build:
      context: ..
      dockerfile: web/Dockerfile
      target: studio
    ports:
      - "${STUDIO_PORT:-8080}:8080"
    environment:
      QDRANT_URL: ${QDRANT_INTERNAL_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      DATABASE_URL: ${PG_INTERNAL_URL:-postgres://rql:rql@postgres:5432/rql_studio}
      STUDIO_PORT: "8080"
    depends_on:
      qdrant:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  postgres:
    profiles: ["pgvector"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rql
      POSTGRES_PASSWORD: rql
      POSTGRES_DB: rql_studio
    ports:
      - "5432:5432"
    volumes:
      - rql_studio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rql -d rql_studio"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  seed-pg:
    profiles: ["pgvector"]
    build:
      context: ..
      dockerfile: web/Dockerfile
      target: seed-pg
    environment:
      DATABASE_URL: ${PG_INTERNAL_URL:-postgres://rql:rql@postgres:5432/rql_studio}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  rql_studio_qdrant:
  rql_studio_pg:
