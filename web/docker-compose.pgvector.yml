# Dual stack: Qdrant + Postgres/pgvector + both seeds + RQL Studio.
#
#   docker compose -f web/docker-compose.pgvector.yml up --build
#   open http://localhost:8080
#
# Connection form:
#   Qdrant   → http://localhost:6333   (blank API key)
#   pgvector → postgres://rql:rql@127.0.0.1:5432/rql_studio
#
# Same extra services via profile on the Qdrant compose file:
#   docker compose -f web/docker-compose.yml --profile pgvector up --build
name: rql-studio

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - rql_studio_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  seed:
    build:
      context: ..
      dockerfile: web/Dockerfile
      target: seed
    environment:
      QDRANT_URL: ${QDRANT_INTERNAL_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_healthy
    restart: on-failure

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rql
      POSTGRES_PASSWORD: rql
      POSTGRES_DB: rql_studio
    ports:
      - "5432:5432"
    volumes:
      - rql_studio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rql -d rql_studio"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  seed-pg:
    build:
      context: ..
      dockerfile: web/Dockerfile
      target: seed-pg
    environment:
      DATABASE_URL: ${PG_INTERNAL_URL:-postgres://rql:rql@postgres:5432/rql_studio}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  studio:
    build:
      context: ..
      dockerfile: web/Dockerfile
      target: studio
    ports:
      - "${STUDIO_PORT:-8080}:8080"
    environment:
      QDRANT_URL: ${QDRANT_INTERNAL_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      DATABASE_URL: ${PG_INTERNAL_URL:-postgres://rql:rql@postgres:5432/rql_studio}
      STUDIO_PORT: "8080"
    depends_on:
      qdrant:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed-pg:
        condition: service_completed_successfully

volumes:
  rql_studio_qdrant:
  rql_studio_pg:
