[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rql"
version = "0.1.0"
description = "RQL — Retrieval Query Language: parse, compile, explain, emit (sketches)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vijay Kumar" }]
keywords = ["rql", "retrieval", "rag", "vector", "query-language"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]
validate = ["jsonschema>=4"]

[project.urls]
Research = "https://github.com/vijaykumarjob0701/rql-rag-query-language"
Repro = "https://github.com/vijaykumarjob0701/rql-repro"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rql = ["profiles/*.json", "schema_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
